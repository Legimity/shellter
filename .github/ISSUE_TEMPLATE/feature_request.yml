name: Feature request
description: Describe a migration problem Shellter should solve.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow, source/target clients and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a successful result look like?
      description: Include alternatives or workarounds you have tried.
    validations:
      required: true
