name: Bug report or compatibility result
description: Report a reproducible problem or share a native-client compatibility check.
title: "[Bug]: "
body:
  - type: input
    id: versions
    attributes:
      label: Versions and platform
      description: Shellter, OS/architecture, Node and native-client versions.
      placeholder: Shellter 0.1.0, Ubuntu 22.04 x86_64, Node 24, client/version
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Source, target and resource type
      description: Which agents, global/project scope, and Skills/MCP/instructions? Use example paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small fixture with fake values, commands or interface steps.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
      description: Distinguish file content, native discovery, execution and authentication. Include sanitized errors only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, login caches, private journals and sensitive configuration from this report.
          required: true
        - label: This is not a vulnerability report; I will use private security reporting for suspected vulnerabilities.
          required: true
