name: Validate Shellter

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo:walkthrough
      - run: npm run check:docs
      - run: npm run release:prepare
      - name: Install and exercise the extracted release
        shell: bash
        run: |
          set -euo pipefail
          unzip -q artifacts/shellter-0.1.0-node24.zip -d "$RUNNER_TEMP/shellter-release"
          cd "$RUNNER_TEMP/shellter-release/shellter-0.1.0-node24"
          npm ci --omit=dev --ignore-scripts
          node dist/cli.js --help
          npm run demo:walkthrough
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shellter-node24-${{ matrix.os }}
          path: |
            artifacts/shellter-0.1.0-node24.zip
            artifacts/shellter-0.1.0-node24.zip.sha256
          if-no-files-found: error
